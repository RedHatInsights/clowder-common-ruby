name: Release
on:
  push:
    branches:
    - master

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Configure git
        run: |
          git config user.name 'Update-a-Bot'
          git config user.email 'insights@redhat.com'
      - name: Publish gem
        run: git diff --name-only HEAD~1 HEAD | grep lib/clowder-common-ruby/version.rb && bundle exec rake release || echo "There is nothing to release"
        env:
          GEM_HOST_API_KEY: "${{secrets.GEM_HOST_API_KEY}}"
