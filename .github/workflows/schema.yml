name: "Schema updater"
on:
  schedule:
  - cron: "5 0 * * *"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Fetch schema
        run: |
          ./sync_config.sh
          git add ./bin/schema.json ./lib/clowder-common-ruby/types.rb
          # If there are changes, bump version
          git diff-index --quiet HEAD -- || ./bin/bump_version
      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(schema): update schema and bump version"
          commit-message: "chore(schema): update schema and bump version"
          sign-commits: true
          branch: "chore/schema-update"
          delete-branch: true
          add-paths: |
            bin/schema.json
            lib/clowder-common-ruby/types.rb
            lib/clowder-common-ruby/version.rb
