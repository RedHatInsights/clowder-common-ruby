name: "Schema updater"
on:
  schedule:
  - cron: "5 0 * * *"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Fetch schema
        run: |
          ./sync_config.sh
          git add ./bin/schema.json ./lib/clowder-common-ruby/types.rb
          # If there are changes, bump version
          git diff-index --quiet HEAD -- || ./bin/bump_version
      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore(schema): update schema and bump version"
          commit-message: "chore(schema): update schema and bump version"
          author: Update-a-Bot <insights@redhat.com>
          committer: Update-a-Bot <insights@redhat.com>
          branch: "chore/schema-update"
          delete-branch: true
          add-paths: |
            bin/schema.json
            lib/clowder-common-ruby/types.rb
            lib/clowder-common-ruby/version.rb
